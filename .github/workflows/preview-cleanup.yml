# Audio-preview cleanup has a separate code path on Linux and macOS (deleting relative to an open
# directory), which the Windows development machines can't exercise. Run its tests there.
name: Preview cleanup (Linux, macOS)

on:
  push:
    paths:
      - src/studio/previews.py
      - tests/test_studio_ui_api.py
      - tests/_file_locks.py
      - .github/workflows/preview-cleanup.yml
  pull_request:
    paths:
      - src/studio/previews.py
      - tests/test_studio_ui_api.py
      - tests/_file_locks.py
      - .github/workflows/preview-cleanup.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  previews:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]  # the oldest Studio supports, and the recommended one
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Only what importing the preview tests needs (no PyTorch or TTS).
      - name: Install test dependencies
        run: python -m pip install "numpy>=2.0" opencv-python-headless tqdm "fastapi>=0.110.0" "python-multipart>=0.0.9" httpx
      - name: Preview retention and shared-workspace tests
        run: python -m unittest -v tests.test_studio_ui_api.PreviewRetentionTests tests.test_studio_ui_api.TwoEnginesOneWorkspaceTests
