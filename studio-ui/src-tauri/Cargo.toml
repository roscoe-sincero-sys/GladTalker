[package]
name = "gladtalker-studio"
version = "0.2.0"
description = "GladTalker Studio desktop app: the Cast → Script → Roll UI with a local engine"
authors = ["GladTalker contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"  # tauri 2.12 and its plugins (Cargo.lock) need 1.90

[lib]
name = "gladtalker_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# Saving over a project keeps its permissions (ReplaceFileW and the file's DACL; see safe_write.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
