build:
  gpu: true
  cuda: "12.4"
  python_version: "3.14"
  system_packages:
    - "ffmpeg"
    - "libgl1"
    - "libglib2.0-0"
  python_packages:
    - "torch"
    - "torchvision"
    - "torchaudio"
    - "numpy>=2.0"
    - "joblib>=1.4.0"
    - "scikit-image>=0.24.0"
    - "facexlib>=0.3.0"
    - "resampy>=0.4.3"
    - "pydub>=0.25.1"
    - "audioop-lts"
    - "soundfile>=0.12.1"
    - "scipy>=1.14.0"
    - "kornia>=0.7.0"
    - "face_alignment>=1.4.0"
    - "imageio>=2.31.0"
    - "imageio-ffmpeg>=0.5.0"
    - "librosa>=0.10.2"
    - "numba>=0.60.0"
    - "tqdm"
    - "yacs>=0.1.8"
    - "opencv-python"
    - "safetensors>=0.4.0"
    - "av>=12.0.0"
    - "trimesh>=4.0.0"
  run:
    - mkdir -p /root/.cache/torch/hub/checkpoints/ && wget --output-document "/root/.cache/torch/hub/checkpoints/s3fd-619a316812.pth" "https://www.adrianbulat.com/downloads/python-fan/s3fd-619a316812.pth"
    - mkdir -p /root/.cache/torch/hub/checkpoints/ && wget --output-document "/root/.cache/torch/hub/checkpoints/2DFAN4-cd938726ad.zip" "https://www.adrianbulat.com/downloads/python-fan/2DFAN4-cd938726ad.zip"

predict: "predict.py:Predictor"
